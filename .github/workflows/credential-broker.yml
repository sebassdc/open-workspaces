name: credential-broker
on:
  pull_request:
    paths: [crates/ow-core/**, docs/examples/credential-policy.json, Cargo.toml, Cargo.lock, .github/workflows/credential-broker.yml]
  push:
    branches: [main]
    paths: [crates/ow-core/**, docs/examples/credential-policy.json, Cargo.toml, Cargo.lock, .github/workflows/credential-broker.yml]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - run: cargo +1.97.0 test --locked -p ow-core
