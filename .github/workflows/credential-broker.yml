name: credential-broker
on:
  pull_request:
    paths: [crates/ow-core/**, docs/examples/credential-policy.json, Cargo.toml, Cargo.lock, .github/workflows/credential-broker.yml]
  push:
    branches: [main]
    paths: [crates/ow-core/**, docs/examples/credential-policy.json, Cargo.toml, Cargo.lock, .github/workflows/credential-broker.yml]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - run: cargo +1.97.0 test --locked -p ow-core
      - name: Check developer exec timeout through a real login shell
        run: |
          test_binary=$(find target/debug/deps -maxdepth 1 -type f -name 'ow_core-*' -executable -print -quit)
          test -n "$test_binary"
          docker run --rm -v "$PWD/target/debug/deps:/tests:ro" ubuntu:24.04 sh -ec '
            useradd --non-unique -u 1000 -m -s /bin/sh dev
            touch /etc/ow-developer
            exec "/tests/$1" production_timeout_recovers_for_developer_exec --ignored --nocapture
          ' sh "$(basename "$test_binary")"
      - name: Check per-box AWS credentials through a real login shell and the SDK chain
        run: |
          test_binary=$(find target/debug/deps -maxdepth 1 -type f -name 'web_identity_chain-*' -executable -print -quit)
          test -n "$test_binary"
          docker run --rm -v "$PWD/target/debug/deps:/tests:ro" ubuntu:24.04 sh -ec '
            useradd --non-unique -u 1000 -m -s /bin/sh dev
            touch /etc/ow-developer
            OW_WEB_IDENTITY_GUEST=1 exec "/tests/$1" --nocapture
          ' sh "$(basename "$test_binary")"
