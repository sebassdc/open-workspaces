# Publishes the deploy/aws Pulumi component: once its package.json version
# reaches main, tag that commit vX.Y.Z so `pulumi package add` can fetch it.
name: aws-component-release
on:
  push:
    branches: [main]
    paths: [deploy/aws/**, Cargo.toml, Cargo.lock, crates/**, docs/ADMIN_API.md, release-impact.json, experiments/runtime-spike/**, scripts/**, .github/workflows/aws-component-release.yml]
  pull_request:
    paths: [deploy/aws/**, Cargo.toml, Cargo.lock, crates/**, docs/ADMIN_API.md, release-impact.json, experiments/runtime-spike/**, scripts/**, .github/workflows/aws-component-release.yml]
permissions:
  contents: write
jobs:
  clients:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: ow-linux-amd64
          - runner: macos-15
            artifact: ow-darwin-arm64
          # Cross-built on Apple silicon and checked under Rosetta 2: Intel macOS runners
          # were the slowest build and the longest queue.
          - runner: macos-15
            artifact: ow-darwin-amd64
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      # Main saves the caches; pull requests restore them (keeps the repository under its cache quota).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}-1.97.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Rosetta 2
        if: matrix.arch == 'x86_64'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build portable Linux CLI using existing build machinery
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl
          bash scripts/build-local.sh
          # Hosts install the released guest agent instead of building it.
          cp data/runtime-spike/guest/ow-guest data/runtime-spike/bin/ow-guest-linux-amd64
          sha256sum data/runtime-spike/bin/ow-guest-linux-amd64 | cut -d ' ' -f 1 > data/runtime-spike/bin/ow-guest-linux-amd64.sha256
          # A musl container with no host libraries catches accidental glibc linkage.
          docker run --rm --user 65534:65534 -v "$PWD/data/runtime-spike/bin:/client:ro" alpine:3.22 /client/ow-linux-amd64 --version
      - name: Build native macOS CLI using existing build machinery
        if: runner.os == 'macOS'
        env:
          OW_MACOS_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-macos.sh
      - name: Check installer failures and clean native install without Rust or cloudflared
        env:
          OW_TEST_CLIENT: ${{ github.workspace }}/data/runtime-spike/bin/${{ matrix.artifact }}
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            # The system Python is universal, so the installer and the client both run as Intel.
            /usr/bin/arch -x86_64 /usr/bin/python3 scripts/test-cli-install.py
          else
            python3 scripts/test-cli-install.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            data/runtime-spike/bin/${{ matrix.artifact }}
            data/runtime-spike/bin/${{ matrix.artifact }}.sha256
            data/runtime-spike/bin/ow-guest-linux-amd64*
          if-no-files-found: error
  # The pre-tag checks need no clients, so they run beside the client builds.
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # test/schema.test.mjs generates the package schema as `pulumi package add` does.
      - uses: pulumi/actions@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: 1.97.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Check SSH throughput and actionable errors before tagging
        working-directory: .
        run: |
          python3 scripts/test-ssh-acceptance.py
          cargo +1.97.0 test --locked -p ow --test ssh_proxy
          cargo +1.97.0 test --locked -p ow --bin ow node_stream_100_mib_each_way
          cargo +1.97.0 test --locked -p ow --bin ow known_rejections_give_safe_actions_without_worker_details
          cargo +1.97.0 test --locked -p ow --bin ow missing_machine_delete
          cargo +1.97.0 test --locked -p ow --test discovery
          cargo +1.97.0 test --locked -p ow --bin ow -- heartbeats_continue_while nodes_show_the_host_reserve
      - name: Check node telemetry and alerts before tagging
        working-directory: .
        run: cargo +1.97.0 test --locked -p ow --bin ow telemetry
      - name: Check the admin API, its CLI wrappers and docs/ADMIN_API.md stay in step
        working-directory: .
        run: |
          cargo +1.97.0 test --locked -p ow --bin ow -- admin:: admin_api_gate host_admin_requires workload_token spill placement::tests pools_take_only
      - name: Check tailnet previews before tagging
        working-directory: .
        run: cargo +1.97.0 test --locked -p ow --bin ow preview
      - name: Check replacement-controller stale authority and drill guards
        working-directory: .
        run: |
          cargo +1.97.0 test --locked -p ow --bin ow restored_controller_rejects_previously_issued_job_and_old_session_results
          python3 -m unittest discover -s scripts -p 'test_controller_recovery_acceptance.py'
      - name: Check recovery control-plane isolation
        working-directory: .
        run: |
          cargo +1.97.0 test --locked -p ow --bin ow -- one_blocked_heartbeat_write_leaves_other_runners_online a_stalled_health_write_neither_stops_the_controller_nor_strands_a_runner a_runtime_stall_does_not_drop_the_sessions_it_delayed live_health_preserves_catalog_policy_revocation_and_restart_fences an_agent_reconnects_by_itself_when_the_controller_goes_silent
      - name: Check snapshot admission and failure recovery before tagging
        working-directory: .
        run: |
          cargo +1.97.0 test --locked -p ow-core snapshot_
          cargo +1.97.0 test --locked -p ow --bin ow failed_snapshot
          cargo +1.97.0 test --locked -p ow-core clock_tests
          cargo +1.97.0 test --locked -p ow-core vm::memory_tests
          cargo +1.97.0 test --locked -p ow-core runtime::disk_tests
  tag:
    if: github.event_name == 'push'
    needs: [clients, checks]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          pattern: ow-*
          path: release-clients
          merge-multiple: true
      - name: Assemble verified release assets from this commit
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -euo pipefail
          cd release-clients
          for artifact in ow-linux-amd64 ow-guest-linux-amd64 ow-darwin-arm64 ow-darwin-amd64; do
            test "$(sha256sum "$artifact" | cut -d ' ' -f 1)" = "$(cat "$artifact.sha256")"
          done
          cp ../crates/ow/cli/install.sh install.sh
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          sha256sum ow-* install.sh source-commit.txt > SHA256SUMS
      - name: Tag the release
        if: github.event_name == 'push'
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already names a different commit; choose a fresh release version"
              exit 1
            fi
            echo "$tag already names this commit"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
      - name: Prepare GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$tag" --json isDraft --jq .isDraft; then
            gh release create "$tag" --verify-tag --generate-notes --draft
          fi
      - name: Attach clients without replacing published assets
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release-clients.sh "v$(node -p 'require("./deploy/aws/package.json").version')" release-clients
      - name: Publish complete GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$tag" --draft=false
          fi
  published-clients:
    if: github.event_name == 'push'
    needs: tag
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: macos-15
          - runner: macos-15
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta 2
        if: matrix.arch == 'x86_64'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install the published version twice in a clean client directory
        env:
          OW_TEST_PUBLISHED_RELEASE: '1'
          OW_TEST_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python=python3
          if [ "${{ matrix.arch }}" = x86_64 ]; then python='/usr/bin/arch -x86_64 /usr/bin/python3'; fi
          $python scripts/test-cli-install.py InstallTests.test_published_release_download
