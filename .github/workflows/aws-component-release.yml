# Publishes the deploy/aws Pulumi component: once its package.json version
# reaches main, tag that commit vX.Y.Z so `pulumi package add` can fetch it.
name: aws-component-release
on:
  push:
    branches: [main]
    paths: [deploy/aws/**, Cargo.toml, Cargo.lock, crates/**, release-impact.json, experiments/runtime-spike/**, scripts/**, .github/workflows/aws-component-release.yml]
  pull_request:
    paths: [deploy/aws/**, Cargo.toml, Cargo.lock, crates/**, release-impact.json, experiments/runtime-spike/**, scripts/**, .github/workflows/aws-component-release.yml]
permissions:
  contents: write
jobs:
  clients:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: ow-linux-amd64
          - runner: macos-15
            artifact: ow-darwin-arm64
          - runner: macos-15-intel
            artifact: ow-darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Build portable Linux CLI using existing build machinery
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl
          bash scripts/build-local.sh
          # A musl container with no host libraries catches accidental glibc linkage.
          docker run --rm --user 65534:65534 -v "$PWD/data/runtime-spike/bin:/client:ro" alpine:3.22 /client/ow-linux-amd64 --version
      - name: Build native macOS CLI using existing build machinery
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - name: Check installer failures and clean native install without Rust or cloudflared
        env:
          OW_TEST_CLIENT: ${{ github.workspace }}/data/runtime-spike/bin/${{ matrix.artifact }}
        run: python3 scripts/test-cli-install.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            data/runtime-spike/bin/${{ matrix.artifact }}
            data/runtime-spike/bin/${{ matrix.artifact }}.sha256
          if-no-files-found: error
  check-and-tag:
    needs: clients
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # test/schema.test.mjs generates the package schema as `pulumi package add` does.
      - uses: pulumi/actions@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Check SSH throughput and actionable errors before tagging
        working-directory: .
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          cargo +1.97.0 test --locked -p ow --test ssh_proxy
          cargo +1.97.0 test --locked -p ow --bin ow node_stream_100_mib_each_way
          cargo +1.97.0 test --locked -p ow --bin ow known_rejections_give_safe_actions_without_worker_details
      - name: Check tailnet previews before tagging
        working-directory: .
        run: cargo +1.97.0 test --locked -p ow --bin ow preview
      - name: Check snapshot admission and failure recovery before tagging
        working-directory: .
        run: |
          cargo +1.97.0 test --locked -p ow-core snapshot_
          cargo +1.97.0 test --locked -p ow --bin ow failed_snapshot
          cargo +1.97.0 test --locked -p ow-core clock_tests
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          pattern: ow-*
          path: release-clients
          merge-multiple: true
      - name: Assemble verified release assets from this commit
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -euo pipefail
          cd release-clients
          for artifact in ow-linux-amd64 ow-darwin-arm64 ow-darwin-amd64; do
            test "$(sha256sum "$artifact" | cut -d ' ' -f 1)" = "$(cat "$artifact.sha256")"
          done
          cp ../crates/ow/cli/install.sh install.sh
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          sha256sum ow-* install.sh source-commit.txt > SHA256SUMS
      - name: Tag the release
        if: github.event_name == 'push'
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already names a different commit; choose a fresh release version"
              exit 1
            fi
            echo "$tag already names this commit"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
      - name: Prepare GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$tag" --json isDraft --jq .isDraft; then
            gh release create "$tag" --verify-tag --generate-notes --draft
          fi
      - name: Attach clients without replacing published assets
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release-clients.sh "v$(node -p 'require("./deploy/aws/package.json").version')" release-clients
      - name: Publish complete GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$tag" --draft=false
          fi
  published-clients:
    if: github.event_name == 'push'
    needs: check-and-tag
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the published version twice in a clean client directory
        env:
          OW_TEST_PUBLISHED_RELEASE: '1'
          OW_TEST_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/test-cli-install.py InstallTests.test_published_release_download
