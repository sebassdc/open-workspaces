[package]
name = "ow"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "blocking"] }

tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }


axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", features = ["ring"], default-features = false }
sha2 = "0.10"
hyper-util = { version = "0.1", features = ["tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
zstd = { version = "=0.13.3", default-features = false }
http-body = "1"
jsonwebtoken = "9.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tower = { version = "0.5", features = ["util"] }
